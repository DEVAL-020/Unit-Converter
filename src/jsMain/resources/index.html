<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit-Converter</title>
  <meta name="description" content="Convert length, mass, temperature, volume, area, speed, time and data sizes instantly. Written in Kotlin.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffc933'/%3E%3Cpath d='M8 23V9M13 23v-6M18 23V9M23 23v-6' stroke='%2314171c' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Apply the saved (or system) theme before the first paint so the page never flashes the wrong colors. -->
  <script>
    try {
      var theme = localStorage.getItem("uc.theme");
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Unit converter</h1>
      <button id="theme" class="icon-btn" type="button" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <nav id="categories" class="tabs" aria-label="Unit categories"></nav>

    <section class="converter" aria-label="Converter">
      <div class="field from">
        <label for="from-value">From</label>
        <div class="row">
          <input id="from-value" class="num" data-size="l" type="text" inputmode="decimal"
                 autocomplete="off" spellcheck="false" placeholder="0" value="1">
          <select id="from-unit" class="unit" aria-label="Unit to convert from"></select>
        </div>
        <p id="hint" class="hint" aria-live="polite" hidden>Enter a number, for example 12.5</p>
      </div>

      <div class="ruler">
        <button id="swap" class="swap" type="button" aria-label="Swap units">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M8 20V4M8 4 4.5 7.5M8 4l3.5 3.5M16 4v16M16 20l-3.5-3.5M16 20l3.5-3.5"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="field to">
        <label for="to-unit">To</label>
        <div class="row">
          <output id="to-value" class="num" data-size="l" for="from-value from-unit to-unit">3.2808399</output>
          <select id="to-unit" class="unit" aria-label="Unit to convert to"></select>
        </div>
        <div class="result-meta">
          <span id="rate" class="rate"></span>
          <button id="copy" class="copy" type="button">Copy result</button>
        </div>
      </div>
    </section>

    <section class="all" aria-labelledby="all-title">
      <h2 id="all-title">Other units</h2>
      <ul id="all-list"></ul>
    </section>

    <footer class="foot">
      <p>Written in Kotlin and compiled to JavaScript. View the source on GitHub.</p>
    </footer>

  </main>

</body>
</html>
